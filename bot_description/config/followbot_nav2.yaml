bt_navigator:
  ros__parameters:
    robot_base_frame: base_link
    odom_topic: /odom

controller_server:
  ros__parameters:
    # The terrain GridMap arrives at 2 Hz and can take up to ~0.8 s under load.
    controller_frequency: 10.0
    costmap_update_timeout: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: /odom
    enable_stamped_cmd_vel: false
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.2
      lookahead_dist: 1.5
      min_lookahead_dist: 0.8
      max_lookahead_dist: 2.0
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true
      use_rotate_to_heading: true
      max_angular_accel: 1.0
      allow_reversing: false

following_server:
  ros__parameters:
    controller_frequency: 20.0
    detection_timeout: 1.0
    rotate_to_object_timeout: 5.0
    static_object_timeout: -1.0
    linear_tolerance: 0.15
    angular_tolerance: 0.15
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    filter_coef: 0.1
    desired_distance: 2.0
    skip_orientation: true
    search_by_rotating: false
    odom_topic: /odom
    odom_duration: 0.3
    transform_tolerance: 0.1
    enable_stamped_cmd_vel: false
    controller:
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.1
      v_linear_max: 0.25
      v_angular_max: 0.8
      slowdown_radius: 0.15
      use_collision_detection: true
      costmap_topic: /local_costmap/costmap_raw
      footprint_topic: /local_costmap/published_footprint
      transform_tolerance: 0.1
      projection_time: 2.0
      simulation_time_step: 0.1
      dock_collision_threshold: 0.3

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.3
      footprint: "[[0.78, 0.60], [0.78, -0.60], [-0.78, -0.60], [-0.78, 0.60]]"
      plugins: ["ground_consistency", "traversability", "inflation_layer"]
      ground_consistency:
        plugin: nav2_ground_consistency_costmap_plugin::GroundConsistencyLayer
        ground_points_topic: /ground_segmentation/ground_points
        nonground_points_topic: /ground_segmentation/obstacle_points
        tf_timeout: 0.5
        # Match the validated terrain step limit: smaller height changes are terrain.
        min_clearance: 0.20
        robot_height: 1.0
        maximum_height_filter: 2.0
        ground_inc: 1.25
        nonground_inc: 1.0
        nonground_decay: 0.85
        ground_decay: 0.90
        max_score: 5000.0
        nonground_occ_thresh: 8.0
        nonground_prob_thresh: 0.85
        discretize_costs: true
        max_data_range: 30.0
        ground_neighbor_search_cells: 2
      traversability:
        plugin: nav2_gridmap_traversability_layer::TraversabilityLayer
        enabled: true
        topic: /followbot_traversability/terrain_map
        traversability_layer: traversability
        # Calibrated geometric score: only a hard geometric limit is lethal.
        traversability_lethal: 0.001
        traversability_free: 0.55
        traversability_gamma: 3.0
        max_cost: 90.0
        edge_margin_m: 1.0
        qos_reliability: reliable
        grace_period_s: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        cost_scaling_factor: 1.0
        inflation_radius: 1.2

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.3
      track_unknown_space: false
      rolling_window: false
      width: 100
      height: 100
      origin_x: -50.0
      origin_y: -50.0
      footprint: "[[0.78, 0.60], [0.78, -0.60], [-0.78, -0.60], [-0.78, 0.60]]"
      plugins: ["obstacle_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: pointcloud
        pointcloud:
          topic: /ground_segmentation/obstacle_points
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: PointCloud2

behavior_server:
  ros__parameters:
    cycle_frequency: 2.0
    behavior_plugins: ["backup", "drive_on_heading", "wait", "spin"]
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    spin:
      plugin: nav2_behaviors::Spin
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5

collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: false
    polygons: ["FollowBotFootprint"]
    FollowBotFootprint:
      type: polygon
      action_type: stop
      # Stop before an obstacle reaches the physical footprint. Following
      # Server commands velocity directly, so Collision Monitor is the brake.
      points: "[[-0.90, -0.80], [-0.90, 0.80], [1.50, 0.80], [1.50, -0.80]]"
      visualize: true
      enabled: true
    observation_sources: ["pointcloud"]
    pointcloud:
      type: pointcloud
      topic: /ground_segmentation/obstacle_points
      min_height: 0.2
      max_height: 2.0
      enabled: true

docking_server:
  ros__parameters:
    base_frame: base_link
    fixed_frame: odom
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
